name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: |
          cargo build --release --locked
          strip target/release/mixarchy-ctl

      - name: Generate checksum
        run: (cd target/release && sha256sum mixarchy-ctl > ../../checksums.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/release/mixarchy-ctl
            checksums.txt
          generate_release_notes: true

      - name: Pin release checksum in codebase
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          SHA256=$(awk '{print $1}' checksums.txt)
          echo "Release tag: ${TAG_NAME}"
          echo "Calculated SHA256: ${SHA256}"

          # Check if already pinned
          CURRENT_PIN=$(grep -E 'readonly property string expectedSha256:' Panel.qml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$CURRENT_PIN" = "$SHA256" ]; then
            echo "Checksum is already pinned in codebase. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Switch to master branch
          git checkout master
          git pull origin master --rebase

          # Update tag and checksum in Panel.qml and install.sh
          sed -i -E "s/(readonly property string releaseTag: \")[^\"]*(\")/\1${TAG_NAME}\2/" Panel.qml
          sed -i -E "s/(readonly property string expectedSha256: \")[^\"]*(\")/\1${SHA256}\2/" Panel.qml

          sed -i -E "s/^(RELEASE_TAG=\")[^\"]*(\")/\1${TAG_NAME}\2/" install.sh
          sed -i -E "s/^(EXPECTED_SHA256=\")[^\"]*(\")/\1${SHA256}\2/" install.sh

          git commit -am "chore(security): pin ${TAG_NAME} release checksum from CI [skip ci]"
          git push origin master

          # Move tag to point to the commit containing the pinned checksum
          git tag -f "${TAG_NAME}"
          git push origin -f "${TAG_NAME}"
